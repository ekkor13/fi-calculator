<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="no-referrer">
<title>FI Tools</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bk:#2C2C2E;--rd:#B83A3A;--bg:#F5F2EC;--gr:#6E6E73;--ln:#D6D3CB}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--bk);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
.bar{background:var(--bk);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.bar-title{color:var(--bg);font-size:16px;font-weight:600;letter-spacing:-.3px;cursor:pointer}
.bar-dot{width:8px;height:8px;background:var(--rd)}
.bar-right{display:flex;align-items:center;gap:12px}
.lang-btn{background:none;border:1px solid rgba(255,255,255,.3);color:var(--bg);font-size:12px;font-weight:600;padding:3px 8px;cursor:pointer}
.ph{padding:20px 16px 16px;border-bottom:1.5px solid var(--bk)}
.ph-sub{font-size:11px;color:var(--gr);letter-spacing:1.5px;text-transform:uppercase;font-weight:500}
.ph-title{font-size:20px;font-weight:600;color:var(--bk);margin-top:4px;line-height:1.2}
.tools{padding:0 16px 20px}
.t-sect{font-size:11px;color:var(--gr);letter-spacing:1.5px;text-transform:uppercase;font-weight:500;padding:20px 0 8px}
.t-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.t-item:last-child{border:none}
.t-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.t-icon.red{background:var(--rd);color:var(--bg)}.t-icon.dark{background:var(--bk);color:var(--bg)}.t-icon.out{border:1.5px solid var(--bk);color:var(--bk)}
.t-name{font-size:14px;font-weight:600}.t-desc{font-size:12px;color:var(--gr);margin-top:1px;line-height:1.3}
.t-arrow{margin-left:auto;color:var(--gr);font-size:11px}
.fields{padding:0 16px 16px}
.f{padding:14px 0;border-bottom:1px solid var(--ln)}.f:last-child{border:none}
.f-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.f-lbl{font-size:13px;color:var(--gr);font-weight:500}
.f-val{font-size:16px;font-weight:600;color:var(--bk);cursor:pointer;padding:4px 8px;border-bottom:1.5px solid var(--rd);font-variant-numeric:tabular-nums;min-height:32px;display:inline-flex;align-items:center}
.f-input{width:130px;font-size:16px;font-weight:600;text-align:right;padding:2px 4px;border:none;border-bottom:2px solid var(--rd);background:transparent;color:var(--bk);outline:none;font-family:inherit}
input[type=range]{width:100%;height:36px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;outline:none;margin-top:4px;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ln)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:var(--bk);margin-top:-11px}
input[type=range]::-moz-range-track{height:2px;background:var(--ln);border:none}
input[type=range]::-moz-range-thumb{width:24px;height:24px;background:var(--bk);border:none;cursor:pointer}
input[type=range]::-moz-range-progress{height:2px;background:var(--bk)}
.f-note{font-size:11px;color:var(--gr);margin-top:4px}
.seg{display:flex;margin:16px 16px 0;border:1.5px solid var(--bk)}
.seg button{flex:1;padding:8px 0;border:none;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--gr);transition:.15s}
.seg button.on{background:var(--bk);color:var(--bg)}
.seg button+button{border-left:1.5px solid var(--bk)}
.tog{display:flex;gap:0;margin:16px 16px 0;border:1.5px solid var(--bk)}
.tog button{flex:1;padding:10px 0;border:none;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--gr);transition:.15s}
.tog button.on{background:var(--bk);color:var(--bg)}
.tog button+button{border-left:1.5px solid var(--bk)}
.res{background:var(--bk);padding:20px;margin:16px}
.res-lbl{font-size:11px;color:var(--gr);letter-spacing:1px;text-transform:uppercase}
.res-num{font-size:30px;font-weight:700;color:var(--bg);margin-top:4px;font-variant-numeric:tabular-nums}
.res-line{width:24px;height:3px;background:var(--rd);margin-top:10px}
.res-row{display:flex;gap:16px;margin-top:14px}
.res-item{flex:1}.res-item-lbl{font-size:11px;color:#9A9A9E}
.res-item-val{font-size:14px;font-weight:600;color:var(--bg);margin-top:2px;font-variant-numeric:tabular-nums}
.res.bad{background:var(--rd)}.res.bad .res-lbl{color:rgba(255,255,255,.6)}.res.bad .res-item-lbl{color:rgba(255,255,255,.5)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);margin:16px;border:1px solid var(--ln)}
.info-cell{background:var(--bg);padding:12px}.info-cell-lbl{font-size:11px;color:var(--gr)}
.info-cell-val{font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-row{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ln)}.stat-row:last-child{border:none}
.stat-lbl{font-size:13px;color:var(--gr)}.stat-val{font-size:13px;font-weight:600}
.section-title{font-size:11px;color:var(--gr);letter-spacing:1.5px;text-transform:uppercase;font-weight:500;padding:20px 16px 8px}
.hint{margin:16px;padding:18px 16px 18px 20px;border-left:3px solid var(--rd);font-size:13px;color:var(--gr);line-height:1.7}
.hint b{color:var(--bk);font-weight:600;display:block;margin-bottom:6px;font-size:14px}
.disclaimer{margin:0 16px 16px;padding:12px 16px;border:1px solid var(--ln);font-size:11px;color:var(--gr);line-height:1.5}
.footer{text-align:center;font-size:11px;color:var(--gr);padding:20px 16px;letter-spacing:.3px}
</style>
</head>
<body>
<div class="bar" id="bar">
  <span class="bar-title" id="barTitle" onclick="go('home')">FI Tools</span>
  <div class="bar-right"><button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button><div class="bar-dot"></div></div>
</div>
<div id="app"></div>
<div class="disclaimer" id="discl"></div>
<div class="footer" id="footerEl"></div>
<script>
var tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}
var L='ru',curPage='home',fiRateVal=.07,fiEarners=1,fiTab=0,olimType=0,cityType=0;

var T={ru:{
back:'← назад',calc:'Калькулятор',ref:'Справка',compare:'Сравнение',calcs:'Калькуляторы',
heroTitle:'Финансовые инструменты<br>для жизни в Израиле',
tapNum:'Нажми на число — можно вбить вручную. Данные не сохраняются.',
discl:'Расчёты приблизительные, не являются финансовой консультацией. Данные 2024-2025.',
footer:'FI Tools · Israel 2026 · Данные не сохраняются',
inc:'Доход нетто',sav:'Накопления',exp:'Расходы/мес',yrs:'лет',mos:'мес.',
toFI:'до финансовой независимости',need:'Нужно накопить',savMo:'Откладываешь/мес',savR:'Норма сбережений',
overview:'Обзор по стране',myCalc:'Мой расчёт',one:'Один',two:'Двое',
single:'Один человек',couple:'Пара',famKid:'Семья с ребёнком',
howCalc:'Как считается',unreach:'Недостижимо',
mFi:'Финансовая независимость',mFiD:'Через сколько лет можно не работать',
mTax:'Брутто → Нетто',mTaxD:'Зарплата после налогов',
mMort:'Машканта',mMortD:'Ежемесячный платёж и переплата',
mComp:'Сложный процент',mCompD:'Рост портфеля со временем',
mRent:'Снимать или покупать',mRentD:'Что выгоднее на горизонте N лет',
mCar:'Стоимость машины',mCarD:'Все расходы в месяц',
mOlim:'Льготы для олим',mOlimD:'Саль клита, налоговые льготы',
mInfl:'Инфляция',mInflD:'Покупательная сила денег',
mGoal:'Цель накопления',mGoalD:'Сколько откладывать для цели',
mOsek:'Осек мурше vs наёмный',mOsekD:'Реальный доход фрилансера',
mPitz:'Пицуим',mPitzD:'Компенсация при увольнении',
mHish:'Иштальмут',mHishD:'Забрать или оставить расти',
mHealth:'Фин. здоровье',mHealthD:'Проверь пропорции расходов',
mCity:'Города',mCityD:'Сравнение стоимости жизни',
mStats:'Средние по стране',mStatsD:'Расходы, зарплаты, отчисления',
},en:{
back:'← back',calc:'Calculator',ref:'Reference',compare:'Compare',calcs:'Calculators',
heroTitle:'Financial tools<br>for life in Israel',
tapNum:'Tap any number to type manually. No data is stored.',
discl:'Calculations are approximate and not financial advice. Data 2024-2025.',
footer:'FI Tools · Israel 2026 · No data stored',
inc:'Net income',sav:'Savings',exp:'Expenses/mo',yrs:'years',mos:'mo.',
toFI:'to financial independence',need:'Target',savMo:'Saving/mo',savR:'Savings rate',
overview:'Country average',myCalc:'My calculation',one:'One',two:'Two',
single:'Individual',couple:'Couple',famKid:'Family with kid',
howCalc:'How it works',unreach:'Unreachable',
mFi:'Financial Independence',mFiD:'How many years until you can stop working',
mTax:'Gross → Net',mTaxD:'Salary after taxes',
mMort:'Mortgage',mMortD:'Monthly payment and total cost',
mComp:'Compound interest',mCompD:'Portfolio growth over time',
mRent:'Rent vs Buy',mRentD:'Which is better over N years',
mCar:'True car cost',mCarD:'All expenses per month',
mOlim:'Olim benefits',mOlimD:'Sal klita, tax benefits',
mInfl:'Inflation',mInflD:'Purchasing power over time',
mGoal:'Savings goal',mGoalD:'How much to save for a target',
mOsek:'Freelancer vs Employee',mOsekD:'Real freelancer income after deductions',
mPitz:'Severance',mPitzD:'Compensation on termination',
mHish:'Hishtalmut',mHishD:'Withdraw or keep growing',
mHealth:'Financial health',mHealthD:'Check your spending ratios',
mCity:'Cities',mCityD:'Cost of living comparison',
mStats:'National averages',mStatsD:'Expenses, salaries, deductions',
}};
function t(k){return T[L][k]||T.ru[k]||k}
function toggleLang(){L=L==='ru'?'en':'ru';document.getElementById('langBtn').textContent=L==='ru'?'EN':'RU';renderPage()}

function fm(n){if(n==null||!isFinite(n))return'—';return Math.round(Number(n)).toLocaleString('he-IL')}
function fy(v){if(!isFinite(v)||v<0)return t('unreach');var y=Math.floor(v),m=Math.round((v-y)*12);return y===0?m+' '+t('mos'):m>0?y+' '+t('yrs')+' '+m+' '+t('mos'):y+' '+t('yrs')}
function ss(el){var mn=+el.min,mx=+el.max,v=+el.value;var p=((v-mn)/(mx-mn))*100;el.style.background='linear-gradient(to right,#2C2C2E '+p+'%,#D6D3CB '+p+'%)';el.style.height='2px';el.style.borderRadius='0'}
function fmtV(sid,v){if(/^(txN|olK|pzM)$/.test(sid))return v;if(/^(mrY|cmY|rtY|ifY|glY|pzY|hiW)$/.test(sid))return v;if(/^(mrR|cmR|cmG|rtG|rtM|rtA|caD|ifR|glR|hiR)$/.test(sid))return v+'%';return fm(v)+' ₪'}

function ed(span,sid){
  if(!/^[a-zA-Z0-9]+$/.test(sid))return;
  var sl=document.getElementById(sid);if(!sl||sl.type!=='range')return;
  var inp=document.createElement('input');inp.type='number';inp.className='f-input';inp.value=+sl.value;inp.inputMode='numeric';inp.step=sl.step;inp.min=sl.min;inp.max=sl.max;inp.setAttribute('autocomplete','off');
  span.replaceWith(inp);inp.focus();inp.select();var d=false;
  function done(){if(d)return;d=true;var raw=String(inp.value).replace(/[^0-9.\-]/g,'');var v=parseFloat(raw);if(!isFinite(v))v=0;v=Math.max(+sl.min,Math.min(+sl.max,v));v=Math.round(v/(+sl.step))*(+sl.step);v=parseFloat(v.toFixed(4));sl.value=v;
    var ns=document.createElement('span');ns.className='f-val';ns.id=span.id;ns.textContent=fmtV(sid,v);ns.onclick=function(){ed(ns,sid)};inp.replaceWith(ns);ss(sl);uu(curPage)}
  inp.onblur=done;inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();inp.blur()}}
}

/* ── Slider update: only updates values + result, never destroys sliders ── */
function uu(p){
  document.querySelectorAll('.f-val').forEach(function(s){var sid=s.id.replace(/V$/,'');var sl=document.getElementById(sid);if(sl)s.textContent=fmtV(sid,+sl.value)});
  document.querySelectorAll('input[type=range]').forEach(ss);
  var r=document.getElementById('res-'+p);if(r)r.innerHTML=calcRes(p);
}

function V(id,def){var e=document.getElementById(id);if(!e)return def;var v=+e.value;return isFinite(v)?v:def}

/* ── Navigation ── */
function renderPage(){if(curPage==='home')renderHome();else renderCalc(curPage);document.getElementById('discl').textContent=t('discl');document.getElementById('footerEl').textContent=t('footer')}
function renderHome(){
  document.getElementById('barTitle').textContent='FI Tools';document.getElementById('barTitle').onclick=function(){};
  var items=[['fi','red','FI'],['tax','dark','₪'],['mort','out','⌂'],['comp','dark','%'],['rent','red','⇔'],['car','out','○'],['goal','red','⚑'],['osek','dark','✎'],['pitz','out','☐'],['hish','red','⏳'],['health','dark','♥'],['infl','out','↓']];
  var refs=[['olim','dark','✚'],['city','dark','⚶'],['stats','out','i']];
  var h='<div class="ph"><div class="ph-sub">Israel 2026</div><div class="ph-title">'+t('heroTitle')+'</div></div>';
  h+='<div style="padding:12px 16px;font-size:13px;color:var(--gr);line-height:1.5;border-bottom:1px solid var(--ln)">'+t('tapNum')+'</div><div class="tools"><div class="t-sect">'+t('calcs')+'</div>';
  items.forEach(function(x){h+='<div class="t-item" onclick="go(\''+x[0]+'\')"><div class="t-icon '+x[1]+'">'+x[2]+'</div><div><div class="t-name">'+t('m'+x[0].charAt(0).toUpperCase()+x[0].slice(1))+'</div><div class="t-desc">'+t('m'+x[0].charAt(0).toUpperCase()+x[0].slice(1)+'D')+'</div></div><span class="t-arrow">→</span></div>'});
  h+='<div class="t-sect">'+t('ref')+'</div>';
  refs.forEach(function(x){h+='<div class="t-item" onclick="go(\''+x[0]+'\')"><div class="t-icon '+x[1]+'">'+x[2]+'</div><div><div class="t-name">'+t('m'+x[0].charAt(0).toUpperCase()+x[0].slice(1))+'</div><div class="t-desc">'+t('m'+x[0].charAt(0).toUpperCase()+x[0].slice(1)+'D')+'</div></div><span class="t-arrow">→</span></div>'});
  h+='</div>';document.getElementById('app').innerHTML=h;
}
function go(p){
  curPage=p;if(p==='home'){renderHome();window.scrollTo(0,0);return}
  document.getElementById('barTitle').textContent=t('back');document.getElementById('barTitle').onclick=function(){go('home')};
  renderCalc(p);window.scrollTo(0,0);setTimeout(function(){document.querySelectorAll('input[type=range]').forEach(ss)},30);
}

/* ── Render page (full, only on navigation) ── */
function renderCalc(p){
  var el=document.getElementById('app');
  var pages={fi:pgFI,tax:pgTax,mort:pgMort,comp:pgComp,rent:pgRent,car:pgCar,olim:pgOlim,infl:pgInfl,goal:pgGoal,osek:pgOsek,pitz:pgPitz,hish:pgHish,health:pgHealth,city:pgCity,stats:pgStats};
  el.innerHTML=(pages[p]||function(){return''})();
  setTimeout(function(){document.querySelectorAll('input[type=range]').forEach(ss)},10);
}
function calcRes(p){
  var fns={fi:resFI,tax:resTax,mort:resMort,comp:resComp,rent:resRent,car:resCar,infl:resInfl,goal:resGoal,osek:resOsek,pitz:resPitz,hish:resHish,health:resHealth};
  return(fns[p]||function(){return''})();
}

/* ── Helper: build field HTML ── */
function FH(id,lbl,def,min,max,step,pg,note){
  var cur=V(id,def);
  return '<div class="f"><div class="f-row"><span class="f-lbl">'+lbl+'</span><span class="f-val" id="'+id+'V" onclick="ed(this,\''+id+'\')">'+fmtV(id,cur)+'</span></div><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+cur+'" oninput="uu(\''+pg+'\')">'+(note?'<div class="f-note">'+note+'</div>':'')+'</div>';
}

/* ══════ FI CALC ══════ */
function fiCalc(e,i,p0,r,n,h,pn){var tgt=e*300,s=(i-e)+n*(h+pn);if(s<=0)return{t:1/0,tgt:tgt,s:s};var N=r*tgt+12*s,D=r*p0+12*s;if(D<=0||N/D<=0)return{t:1/0,tgt:tgt,s:s};return{t:Math.log(N/D)/Math.log(1+r),tgt:tgt,s:s}}
function fiResHTML(res,inc){var ok=isFinite(res.t)&&res.t>0;var sr=inc>0?Math.round(res.s/inc*100):0;var h='<div class="res'+(ok?'':' bad')+'"><div class="res-lbl">'+t('toFI')+'</div><div class="res-num">'+(ok?fy(res.t):t('unreach'))+'</div><div class="res-line"></div><div class="res-row"><div class="res-item"><div class="res-item-lbl">'+t('need')+'</div><div class="res-item-val">'+fm(res.tgt)+' ₪</div></div><div class="res-item"><div class="res-item-lbl">'+t('savMo')+'</div><div class="res-item-val">'+fm(Math.round(res.s))+' ₪</div></div></div>';if(inc>0&&ok)h+='<div class="res-row"><div class="res-item"><div class="res-item-lbl">'+t('savR')+'</div><div class="res-item-val">'+sr+'%</div></div><div class="res-item"></div></div>';h+='</div>';return h}

function resFI(){
  var r=fiRateVal;
  if(fiTab===0){return fiResHTML(fiCalc(11000,V('s1i',15000),V('s1p',50000),r,1,1570,3200),V('s1i',15000))+'<div class="section-title">'+t('couple')+'</div>'+fiResHTML(fiCalc(16400,V('s2i',25000),V('s2p',100000),r,2,1570,3200),V('s2i',25000))}
  return fiResHTML(fiCalc(V('ce',11000),V('ci',18000),V('cp',100000),r,fiEarners,V('ch2',1570),V('cn',3200)),V('ci',18000));
}
function pgFI(){
  var r=fiRateVal;
  var h='<div class="ph"><div class="ph-sub">'+t('calc')+'</div><div class="ph-title">'+t('mFi')+'</div></div>';
  h+='<div class="tog"><button '+(fiTab===0?'class="on"':'')+' onclick="fiTab=0;renderCalc(\'fi\')">'+t('overview')+'</button><button '+(fiTab===1?'class="on"':'')+' onclick="fiTab=1;renderCalc(\'fi\')">'+t('myCalc')+'</button></div>';
  h+='<div class="seg"><button '+(r===.05?'class="on"':'')+' onclick="fiRateVal=.05;renderCalc(\'fi\')">5%</button><button '+(r===.07?'class="on"':'')+' onclick="fiRateVal=.07;renderCalc(\'fi\')">7%</button><button '+(r===.09?'class="on"':'')+' onclick="fiRateVal=.09;renderCalc(\'fi\')">9%</button></div>';
  if(fiTab===0){
    h+='<div class="section-title">'+t('single')+'</div><div class="info-grid"><div class="info-cell"><div class="info-cell-lbl">'+t('exp')+'</div><div class="info-cell-val">11,000 ₪</div></div><div class="info-cell"><div class="info-cell-lbl">Target</div><div class="info-cell-val">3,300,000 ₪</div></div></div><div class="fields">';
    h+=FH('s1i',t('inc'),15000,8000,50000,500,'fi');
    h+=FH('s1p',t('sav'),50000,0,2000000,10000,'fi');
    h+='</div><div id="res-fi">'+resFI()+'</div>';
    h+='<div class="fields">';
    h+=FH('s2i',t('inc'),25000,12000,80000,500,'fi');
    h+=FH('s2p',t('sav'),100000,0,3000000,10000,'fi');
    h+='</div>';
  } else {
    h+='<div class="tog"><button '+(fiEarners===1?'class="on"':'')+' onclick="fiEarners=1;renderCalc(\'fi\')">'+t('one')+'</button><button '+(fiEarners===2?'class="on"':'')+' onclick="fiEarners=2;renderCalc(\'fi\')">'+t('two')+'</button></div><div class="fields">';
    h+=FH('ce',t('exp'),11000,5000,40000,500,'fi');
    h+=FH('ci',t('inc'),18000,5000,100000,500,'fi');
    h+=FH('cp',t('sav'),100000,0,5000000,10000,'fi');
    h+=FH('ch2',(L==='ru'?'Керен Иштальмут':'Hishtalmut'),1570,0,3000,10,'fi');
    h+=FH('cn',(L==='ru'?'Пенсия в акции':'Pension equity'),3200,0,6000,100,'fi');
    h+='</div><div id="res-fi">'+resFI()+'</div>';
  }

function pgHish(){var h='<div class="ph"><div class="ph-sub">'+t('calc')+'</div><div class="ph-title">'+t('mHish')+'</div></div><div class="fields">';h+=FH('hiC',(L==='ru'?'Баланс':'Balance'),8e4,5000,5e5,5000,'hish');h+=FH('hiM',(L==='ru'?'Отчисление/мес':'Monthly deposit'),1570,0,3000,10,'hish');h+=FH('hiR',(L==='ru'?'Доходность':'Return'),7,1,15,.5,'hish');h+=FH('hiW',(L==='ru'?'Ждать ещё (лет)':'Wait (years)'),6,6,30,6,'hish',(L==='ru'?'Цикл 6 лет · 0% налог':'6-year cycle · 0% tax'));h+='</div><div id="res-hish">'+resHish()+'</div>';return h}

/* ══════ HEALTH ══════ */
function resHealth(){var inc=Math.max(V('fhI',15000),1),ho=V('fhH',4500),db=V('fhD',0),sv=V('fhS',2000);var hp=Math.round(ho/inc*100),dp=Math.round((ho+db)/inc*100),sp=Math.round(sv/inc*100);var fr=inc-ho-db-sv;function gr(v,g,o){return v<=g?'#4a8c5c':v<=o?'#b8860b':'var(--rd)'}var sc=0;if(hp<=30)sc++;if(hp<=25)sc++;if(dp<=40)sc++;if(dp<=30)sc++;if(sp>=20)sc++;if(sp>=30)sc++;var vd=sc>=5?(L==='ru'?'Отличное':'Excellent'):sc>=3?(L==='ru'?'Нормальное':'OK'):(L==='ru'?'Требует внимания':'Needs attention');var h='<div class="res"><div class="res-lbl">'+(L==='ru'?'состояние':'status')+'</div><div class="res-num" style="font-size:24px">'+vd+'</div><div class="res-line"></div><div class="res-row"><div class="res-item"><div class="res-item-lbl">'+(L==='ru'?'Свободные':'Free')+'</div><div class="res-item-val">'+fm(fr)+' ₪</div></div><div class="res-item"></div></div></div><div style="margin:16px">';var bars=[[L==='ru'?'Жильё':'Housing',hp,gr(hp,30,40),'≤30%'],[L==='ru'?'Долги':'Debts',dp,gr(dp,40,50),'≤40%'],[L==='ru'?'Сбережения':'Savings',sp,sp>=20?'#4a8c5c':sp>=10?'#b8860b':'var(--rd)','≥20%']];bars.forEach(function(b){h+='<div style="padding:14px 0;border-bottom:1px solid var(--ln)"><div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--gr)">'+b[0]+'</span><span style="font-size:16px;font-weight:700;color:'+b[2]+'">'+b[1]+'%</span></div><div style="height:4px;background:var(--ln);margin-top:6px"><div style="height:100%;width:'+Math.min(b[1],100)+'%;background:'+b[2]+'"></div></div></div>'});h+='</div>';return h}
function pgHealth(){var h='<div class="ph"><div class="ph-sub">'+t('calc')+'</div><div class="ph-title">'+t('mHealth')+'</div></div><div class="fields">';h+=FH('fhI',t('inc'),15000,5000,8e4,500,'health');h+=FH('fhH',(L==='ru'?'Жильё':'Housing'),4500,0,2e4,100,'health');h+=FH('fhD',(L==='ru'?'Кредиты':'Debts'),0,0,15000,100,'health');h+=FH('fhS',(L==='ru'?'Откладываешь':'Saving'),2000,0,3e4,100,'health');h+='</div><div id="res-health">'+resHealth()+'</div>';return h}

/* ══════ CITY ══════ */

function pgCity(){var li=L==='ru'?0:1;var h='<div class="ph"><div class="ph-sub">'+t('compare')+'</div><div class="ph-title">'+t('mCity')+'</div></div>';h+='<div class="tog"><button '+(cityType===0?'class="on"':'')+' onclick="cityType=0;renderCalc(\'city\')">'+t('single')+'</button><button '+(cityType===1?'class="on"':'')+' onclick="cityType=1;renderCalc(\'city\')">'+t('couple')+'</button><button '+(cityType===2?'class="on"':'')+' onclick="cityType=2;renderCalc(\'city\')">'+t('famKid')+'</button></div>';var sorted=CITIES.map(function(c){var r=cityType===0?c.r1:cityType===1?c.r2:c.r3;var kid=cityType===2?c.k:0;var gr=Math.round(c.g/100*(cityType===0?2500:cityType===1?4000:5000));return{n:c.n[li],rent:r,arn:c.a,kid:kid,groc:gr,total:r+c.a+kid+gr}}).sort(function(a,b){return a.total-b.total});var ch=sorted[0].total;h+='<div class="section-title">'+(L==='ru'?'От дешёвого к дорогому':'Cheapest to most expensive')+'</div>';sorted.forEach(function(c,i){var df=c.total-ch;h+='<div style="margin:0 16px;padding:14px 0;border-bottom:1px solid var(--ln)"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:600">'+c.n+'</span><span style="font-size:16px;font-weight:700">'+fm(c.total)+' ₪</span></div>';if(i>0)h+='<div style="font-size:11px;color:var(--rd);margin-top:2px">+'+fm(df)+' (+'+Math.round(df/ch*100)+'%)</div>';else h+='<div style="font-size:11px;color:#4a8c5c;margin-top:2px">'+(L==='ru'?'Самый доступный':'Most affordable')+'</div>';h+='<div style="display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--gr);flex-wrap:wrap"><span>'+(L==='ru'?'Аренда':'Rent')+': '+fm(c.rent)+'</span><span>'+(L==='ru'?'Арнона':'Arnona')+': '+fm(c.arn)+'</span>';if(cityType===2)h+='<span>'+(L==='ru'?'Садик':'Daycare')+': '+fm(c.kid)+'</span>';h+='</div></div>'});return h}

/* ══════ STATS ══════ */
function pgStats(){var h='<div class="ph"><div class="ph-sub">'+t('ref')+'</div><div class="ph-title">'+t('mStats')+'</div></div>';var rows=L==='ru'?[['s','Расходы'],['r','Один человек','11,000 ₪/мес'],['r','Семья','16,400 ₪/мес'],['s','Зарплаты'],['r','Средняя брутто','12,600 ₪'],['r','Медиана','9,500 ₪'],['s','Отчисления'],['r','Пенсия (работник+работод.)','18.5%'],['r','Керен Иштальмут','1,570 ₪/мес'],['s','Правило 4%'],['r','Target одиночки','3,300,000 ₪'],['r','Target семьи','4,920,000 ₪'],['r','Средняя доходность','7%/год']]:[['s','Expenses'],['r','Individual','11,000 ₪/mo'],['r','Family','16,400 ₪/mo'],['s','Salaries'],['r','Average gross','12,600 ₪'],['r','Median','9,500 ₪'],['s','Deductions'],['r','Pension (employee+employer)','18.5%'],['r','Keren Hishtalmut','1,570 ₪/mo'],['s','4% Rule'],['r','Individual target','3,300,000 ₪'],['r','Family target','4,920,000 ₪'],['r','Average return','7%/yr']];rows.forEach(function(r){if(r[0]==='s')h+='<div class="section-title">'+r[1]+'</div>';else h+='<div class="stat-row"><span class="stat-lbl">'+r[1]+'</span><span class="stat-val">'+r[2]+'</span></div>'});return h}
