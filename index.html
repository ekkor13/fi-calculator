<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org;">
<meta name="referrer" content="no-referrer">
<title>FI Tools</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bk:#2C2C2E;--rd:#B83A3A;--bg:#F5F2EC;--gr:#6E6E73;--ln:#D6D3CB}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--bk);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body[dir=rtl] .f-val{direction:ltr;text-align:left}
body[dir=rtl] .f-input{direction:ltr;text-align:left}
body[dir=rtl] .res-item-val{direction:ltr}
body[dir=rtl] .info-cell-val{direction:ltr}
body[dir=rtl] .stat-val{direction:ltr;text-align:left}
body[dir=rtl] .res-num{direction:ltr}
body[dir=rtl] .t-arrow{margin-left:0;margin-right:auto}
body[dir=rtl] .hint{border-left:none;border-right:3px solid var(--rd);padding:18px 20px 18px 16px}

.bar{background:var(--bk);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.bar-title{color:var(--bg);font-size:16px;font-weight:600;letter-spacing:-.3px;cursor:pointer}
.bar-dot{width:8px;height:8px;background:var(--rd)}
.bar-right{display:flex;align-items:center;gap:12px}
.lang-btn{background:none;border:1px solid rgba(255,255,255,.3);color:var(--bg);font-size:12px;font-weight:600;padding:3px 8px;cursor:pointer}

.ph{padding:20px 16px 16px;border-bottom:1.5px solid var(--bk)}
.ph-sub{font-size:11px;color:var(--gr);letter-spacing:1.5px;text-transform:uppercase;font-weight:500}
.ph-title{font-size:20px;font-weight:600;color:var(--bk);margin-top:4px;line-height:1.2}

.tools{padding:0 16px 20px}
.t-sect{font-size:11px;color:var(--gr);letter-spacing:1.5px;text-transform:uppercase;font-weight:500;padding:20px 0 8px}
.t-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.t-item:last-child{border:none}
.t-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.t-icon.red{background:var(--rd);color:var(--bg)}
.t-icon.dark{background:var(--bk);color:var(--bg)}
.t-icon.out{border:1.5px solid var(--bk);color:var(--bk)}
.t-name{font-size:14px;font-weight:600}
.t-desc{font-size:12px;color:var(--gr);margin-top:1px;line-height:1.3}
.t-arrow{margin-left:auto;color:var(--gr);font-size:11px}

.fields{padding:0 16px 16px}
.f{padding:14px 0;border-bottom:1px solid var(--ln)}
.f:last-child{border:none}
.f-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.f-lbl{font-size:13px;color:var(--gr);font-weight:500}
.f-val{font-size:16px;font-weight:600;color:var(--bk);cursor:pointer;padding:4px 8px;border-bottom:1.5px solid var(--rd);font-variant-numeric:tabular-nums;min-height:32px;display:inline-flex;align-items:center;direction:ltr}
.f-input{width:130px;font-size:16px;font-weight:600;text-align:right;padding:2px 4px;border:none;border-bottom:2px solid var(--rd);background:transparent;color:var(--bk);outline:none;font-family:inherit;direction:ltr}
input[type=range]{width:100%;height:36px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;outline:none;margin-top:4px;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ln)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:var(--bk);margin-top:-11px}
input[type=range]::-moz-range-track{height:2px;background:var(--ln);border:none}
input[type=range]::-moz-range-thumb{width:24px;height:24px;background:var(--bk);border:none;cursor:pointer}
input[type=range]::-moz-range-progress{height:2px;background:var(--bk)}
.f-note{font-size:11px;color:var(--gr);margin-top:4px}
.tip{border-bottom:1px dotted var(--gr);cursor:help}

.seg{display:flex;margin:16px 16px 0;border:1.5px solid var(--bk)}
.seg button{flex:1;padding:8px 0;border:none;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--gr);transition:.15s}
.seg button.on{background:var(--bk);color:var(--bg)}
.seg button+button{border-left:1.5px solid var(--bk)}
body[dir=rtl] .seg button+button{border-left:none;border-right:1.5px solid var(--bk)}

.tog{display:flex;gap:0;margin:16px 16px 0;border:1.5px solid var(--bk)}
.tog button{flex:1;padding:10px 0;border:none;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--gr);transition:.15s}
.tog button.on{background:var(--bk);color:var(--bg)}
.tog button+button{border-left:1.5px solid var(--bk)}
body[dir=rtl] .tog button+button{border-left:none;border-right:1.5px solid var(--bk)}

.res{background:var(--bk);padding:20px;margin:16px}
.res-lbl{font-size:11px;color:var(--gr);letter-spacing:1px;text-transform:uppercase}
.res-num{font-size:30px;font-weight:700;color:var(--bg);margin-top:4px;font-variant-numeric:tabular-nums;direction:ltr}
.res-line{width:24px;height:3px;background:var(--rd);margin-top:10px}
.res-row{display:flex;gap:16px;margin-top:14px}
.res-item{flex:1}
.res-item-lbl{font-size:11px;color:#9A9A9E}
.res-item-val{font-size:14px;font-weight:600;color:var(--bg);margin-top:2px;font-variant-numeric:tabular-nums;direction:ltr}
.res.bad{background:var(--rd)}
.res.bad .res-lbl{color:rgba(255,255,255,.6)}
.res.bad .res-item-lbl{color:rgba(255,255,255,.5)}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);margin:16px;border:1px solid var(--ln)}
.info-cell{background:var(--bg);padding:12px}
.info-cell-lbl{font-size:11px;color:var(--gr)}
.info-cell-val{font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;direction:ltr}

.stat-row{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ln)}
.stat-row:last-child{border:none}
.stat-lbl{font-size:13px;color:var(--gr)}
.stat-val{font-size:13px;font-weight:600}

.section-title{font-size:11px;color:var(--gr);letter-spacing:1.5px;text-transform:uppercase;font-weight:500;padding:20px 16px 8px}
.hint{margin:16px;padding:18px 16px 18px 20px;border-left:3px solid var(--rd);font-size:13px;color:var(--gr);line-height:1.7}
.hint b{color:var(--bk);font-weight:600;display:block;margin-bottom:6px;font-size:14px}
.disclaimer{margin:0 16px 16px;padding:12px 16px;border:1px solid var(--ln);font-size:11px;color:var(--gr);line-height:1.5}
.footer{text-align:center;font-size:11px;color:var(--gr);padding:20px 16px;letter-spacing:.3px}
</style>
</head>
<body>

<div class="bar" id="bar">
  <span class="bar-title" id="barTitle" onclick="go('home')">FI Tools</span>
  <div class="bar-right">
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">עב</button>
    <div class="bar-dot"></div>
  </div>
</div>

<div id="app"></div>

<div class="disclaimer" id="discl"></div>
<div class="footer" id="footerEl"></div>

<script>
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand()}

var L='ru';
var curPage='home';
var fiRateVal=.07,fiEarners=1,olimType=0,cityType=0;

/* ══════ TRANSLATIONS ══════ */
var T={
ru:{
  // general
  calc:'Калькулятор',compare:'Сравнение',ref:'Справка',back:'← назад',

  // menu items
  mFi:'Финансовая независимость',mFiD:'Через сколько лет можно не работать',

  mComp:'Сложный процент',mCompD:'Рост вклада или портфеля со временем',
  mRent:'Снимать или покупать',mRentD:'Что выгоднее на горизонте N лет',

  mOlim:'Льготы для олим',mOlimD:'Саль клита, налоговые льготы, сроки',
  mInfl:'Инфляция',mInflD:'Покупательная сила денег со временем',
  mGoal:'Цель накопления',mGoalD:'Сколько откладывать чтобы собрать X за Y лет',
  mOsek:'Осек мурше vs наёмный',mOsekD:'Реальный доход фрилансера после всех вычетов',
  mPitz:'Пицуим при увольнении',mPitzD:'Компенсация за стаж работы',
  mHish:'Иштальмут: забрать или оставить',mHishD:'Сколько потеряешь если снимешь сейчас',
  mHealth:'Финансовое здоровье',mHealthD:'Проверь свои пропорции расходов',
  mCity:'Города Израиля',mCityD:'Стоимость жизни по городам',
  mStats:'Средние по стране',mStatsD:'Расходы, зарплаты, отчисления — ЦСБ',
  // common labels
  incNet:'Доход нетто',savings:'Накопления',expenses:'Расходы в месяц',
  yrs:'лет',mos:'мес.',toFI:'до финансовой независимости',
  needSave:'Нужно накопить',savPerMo:'Откладываешь/мес',savRate:'Норма сбережений',
  overview:'Обзор по стране',myCalc:'Мой расчёт',
  one:'Один',two:'Двое',single:'Один',couple:'Пара',famKid:'Семья с ребёнком',
  howCalc:'Как считается',
  unreachable:'Недостижимо',
},
he:{
  calc:'מחשבון',compare:'השוואה',ref:'מידע',back:'→ חזרה',
  tapNum:'כל המחשבונים עובדים אופליין. הנתונים לא נשמרים ולא נשלחים. לחץ על מספר כדי להקליד ידנית.',
  discl:'החישובים הם הערכות בלבד ואינם מהווים ייעוץ פיננסי. לחישובים מדויקים פנה ליועץ מס מוסמך. נתוני 2024-2025.',
  footer:'FI Tools · Israel 2026 · הנתונים לא נשמרים',
  heroSub:'Israel 2026',heroTitle:'כלים פיננסיים\nלחיים בישראל',
  calcs:'מחשבונים',
  mFi:'עצמאות כלכלית',mFiD:'עוד כמה שנים אפשר להפסיק לעבוד',
  mTax:'ברוטו → נטו',mTaxD:'משכורת אחרי מסים וניכויים',
  mMort:'משכנתא',mMortD:'תשלום חודשי ועלות כוללת',
  mComp:'ריבית דריבית',mCompD:'צמיחת תיק השקעות לאורך זמן',
  mRent:'לשכור או לקנות',mRentD:'מה משתלם יותר על פני N שנים',
  mCar:'עלות אמיתית של רכב',mCarD:'ביטוח, דלק, טסט, פחת — הכל',
  mOlim:'הטבות לעולים',mOlimD:'סל קליטה, הטבות מס, לוחות זמנים',
  mInfl:'אינפלציה',mInflD:'כוח הקנייה של הכסף לאורך זמן',
  mGoal:'יעד חיסכון',mGoalD:'כמה לחסוך בחודש כדי להגיע ליעד',
  mOsek:'עוסק מורשה vs שכיר',mOsekD:'ההכנסה האמיתית של פרילנסר',
  mPitz:'פיצויי פיטורין',mPitzD:'פיצויים לפי ותק ומשכורת',
  mHish:'השתלמות: למשוך או להשאיר',mHishD:'כמה תפסיד אם תמשוך עכשיו',
  mHealth:'בריאות פיננסית',mHealthD:'בדיקת יחסי ההוצאות שלך',
  mCity:'ערים בישראל',mCityD:'השוואת יוקר מחיה בין ערים',
  mStats:'ממוצעים ארציים',mStatsD:'הוצאות, שכר, הפרשות — לפי הלמ"ס',
  incNet:'הכנסה נטו',savings:'חסכונות',expenses:'הוצאות חודשיות',
  yrs:'שנים',mos:'חודשים',toFI:'עד עצמאות כלכלית',
  needSave:'יעד',savPerMo:'חוסך/חודש',savRate:'שיעור חיסכון',
  overview:'סקירה ארצית',myCalc:'חישוב אישי',
  one:'יחיד',two:'שניים',single:'יחיד',couple:'זוג',famKid:'משפחה עם ילד',
  howCalc:'איך זה מחושב',
  unreachable:'לא ניתן להשגה',
}
};

function t(k){return T[L][k]||T['ru'][k]||k}

function toggleLang(){
  L=L==='ru'?'he':'ru';
  document.body.dir=L==='he'?'rtl':'ltr';
  document.documentElement.lang=L;
  document.getElementById('langBtn').textContent=L==='ru'?'עב':'RU';
  renderPage();
}

/* ══════ RENDER ══════ */
function renderPage(){
  if(curPage==='home')renderHome();
  else renderCalc(curPage);
  document.getElementById('discl').textContent=t('discl');
  document.getElementById('footerEl').textContent=t('footer');
}

function renderHome(){
  document.getElementById('barTitle').textContent='FI Tools';
  document.getElementById('bar').style.cursor='default';

  var items=[
    ['fi','red','FI','mFi','mFiD'],['tax','dark','₪','mTax','mTaxD'],
    ['mort','out','⌂','mMort','mMortD'],['comp','dark','%','mComp','mCompD'],
    ['rent','red','⇔','mRent','mRentD'],['car','out','○','mCar','mCarD'],
    ['goal','red','⚑','mGoal','mGoalD'],['osek','dark','✎','mOsek','mOsekD'],
    ['pitz','out','☐','mPitz','mPitzD'],['hish','red','⏳','mHish','mHishD'],
    ['health','dark','♥','mHealth','mHealthD'],['infl','out','↓','mInfl','mInflD'],
  ];
  var refs=[['olim','dark','✚','mOlim','mOlimD'],['city','dark','⚶','mCity','mCityD'],['stats','out','i','mStats','mStatsD']];

  var h='<div class="ph"><div class="ph-sub">'+t('heroSub')+'</div><div class="ph-title">'+t('heroTitle').replace('\n','<br>')+'</div></div>';
  h+='<div style="padding:12px 16px;font-size:13px;color:var(--gr);line-height:1.5;border-bottom:1px solid var(--ln)">'+t('tapNum')+'</div>';
  h+='<div class="tools"><div class="t-sect">'+t('calcs')+'</div>';
  items.forEach(function(it){
    h+='<div class="t-item" onclick="go(\''+it[0]+'\')"><div class="t-icon '+it[1]+'">'+it[2]+'</div><div><div class="t-name">'+t(it[3])+'</div><div class="t-desc">'+t(it[4])+'</div></div><span class="t-arrow">→</span></div>';
  });
  h+='<div class="t-sect">'+t('ref')+'</div>';
  refs.forEach(function(it){
    h+='<div class="t-item" onclick="go(\''+it[0]+'\')"><div class="t-icon '+it[1]+'">'+it[2]+'</div><div><div class="t-name">'+t(it[3])+'</div><div class="t-desc">'+t(it[4])+'</div></div><span class="t-arrow">→</span></div>';
  });
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function go(p){
  curPage=p;
  if(p==='home'){
    document.getElementById('barTitle').onclick=function(){};
    renderHome();window.scrollTo(0,0);return;
  }
  document.getElementById('barTitle').textContent=t('back');
  document.getElementById('barTitle').onclick=function(){go('home')};
  document.getElementById('bar').style.cursor='pointer';
  renderCalc(p);
  window.scrollTo(0,0);
  setTimeout(function(){document.querySelectorAll('input[type=range]').forEach(ss)},30);
}

/* ══════ UTILITY ══════ */
function fm(n){if(n==null||!isFinite(n))return'—';return Math.round(Number(n)).toLocaleString('he-IL')}
function fy(t_val){
  if(!isFinite(t_val)||t_val<0)return t('unreachable');
  var y=Math.floor(t_val),m=Math.round((t_val-y)*12);
  if(y===0)return m+' '+t('mos');
  return m>0?y+' '+t('yrs')+' '+m+' '+t('mos'):y+' '+t('yrs');
}
function ss(el){
  var mn=+el.min,mx=+el.max,v=+el.value;
  var p=((v-mn)/(mx-mn))*100;
  el.style.background='linear-gradient(to right,#2C2C2E '+p+'%,#D6D3CB '+p+'%)';
  el.style.height='2px';el.style.borderRadius='0';
}
function fmtV(sid,v){
  if(/^(txN|olK|pzM)$/.test(sid))return v;
  if(/^(mrY|cmY|rtY|ifY|glY|pzY|hiW)$/.test(sid))return v;
  if(/^(mrR|cmR|cmG|rtG|rtM|rtA|caD|ifR|glR|hiR)$/.test(sid))return v+'%';
  return fm(v)+' ₪';
}
function ed(span,sid){
  var sl=document.getElementById(sid);if(!sl)return;
  var cv=+sl.value;
  var inp=document.createElement('input');
  inp.type='number';inp.className='f-input';inp.value=cv;inp.inputMode='numeric';
  inp.step=sl.step;inp.min=sl.min;inp.max=sl.max;inp.setAttribute('autocomplete','off');
  span.replaceWith(inp);inp.focus();inp.select();
  var done_=false;
  function done(){if(done_)return;done_=true;
    var raw=String(inp.value).replace(/[^0-9.\-]/g,'');
    var v=parseFloat(raw)||0;
    v=Math.max(+sl.min,Math.min(+sl.max,v));
    v=Math.round(v/(+sl.step))*(+sl.step);
    v=parseFloat(v.toFixed(4));sl.value=v;
    var ns=document.createElement('span');ns.className='f-val';ns.id=span.id;
    ns.textContent=fmtV(sid,v);ns.onclick=function(){ed(ns,sid)};
    inp.replaceWith(ns);ss(sl);renderCalc(curPage);
  }
  inp.onblur=done;inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();inp.blur()}};
}

/* ══════ CALCULATOR PAGES ══════ */
function renderCalc(p){
  var el=document.getElementById('app');
  var h='';
  var V=function(id,def){var e=document.getElementById(id);return e?+e.value:def};

  if(p==='fi'){h=renderFIPage(V)}
  else if(p==='tax'){h=renderTaxPage(V)}
  else if(p==='mort'){h=renderMortPage(V)}
  else if(p==='comp'){h=renderCompPage(V)}
  else if(p==='rent'){h=renderRentPage(V)}
  else if(p==='car'){h=renderCarPage(V)}
  else if(p==='olim'){h=renderOlimPage(V)}
  else if(p==='infl'){h=renderInflPage(V)}
  else if(p==='goal'){h=renderGoalPage(V)}
  else if(p==='osek'){h=renderOsekPage(V)}
  else if(p==='pitz'){h=renderPitzPage(V)}
  else if(p==='hish'){h=renderHishPage(V)}
  else if(p==='health'){h=renderHealthPage(V)}
  else if(p==='city'){h=renderCityPage(V)}
  else if(p==='stats'){h=renderStatsPage()}

  el.innerHTML=h;
  setTimeout(function(){document.querySelectorAll('input[type=range]').forEach(ss)},10);
}

/* ── FI ── */
function fiCalc(e,i,p0,r,n,his,pen){
  var tgt=e*300,s=(i-e)+n*(his+pen);
  if(s<=0)return{t:1/0,tgt:tgt,s:s};
  var N_=r*tgt+12*s,D_=r*p0+12*s;
  if(D_<=0||N_/D_<=0)return{t:1/0,tgt:tgt,s:s};
  return{t:Math.log(N_/D_)/Math.log(1+r),tgt:tgt,s:s};
}
function fiResult(res,inc){
  var ok=isFinite(res.t)&&res.t>0;
  var sr=inc>0?Math.round(res.s/inc*100):0;

/* ── TAX ── */
function renderTaxPage(V){
  var b=V('txB',15000),n=V('txN',2.25);
  var annual=b*12;
  var brackets=[[81480,.1],[116760,.14],[187440,.2],[260520,.31],[542160,.35],[698280,.47],[1/0,.5]];
  var tax=0,prev=0;
  for(var i=0;i<brackets.length;i++){var cap=brackets[i][0],rate=brackets[i][1];if(annual<=cap){tax+=(annual-prev)*rate;break}tax+=(cap-prev)*rate;prev=cap}
  tax=Math.max(0,tax-n*242*12);var taxM=Math.round(tax/12);
  var blB=Math.min(b,6331),blO=Math.max(0,Math.min(b,44020)-6331);
  var bl=Math.round(blB*.004+blO*.07),hp=Math.round(blB*.031+blO*.05),pen=Math.round(b*.06);

  h+='<div class="f"><div class="f-row"><span class="f-lbl">'+(L==='ru'?'Доходность/год':'תשואה/שנה')+'</span><span class="f-val" id="hiRV" onclick="ed(this,\'hiR\')">'+Math.round(r*100)+'%</span></div><input type="range" id="hiR" min="1" max="15" step="0.5" value="'+Math.round(r*100)+'" oninput="renderCalc(\'hish\')"></div>';
  h+='<div class="f"><div class="f-row"><span class="f-lbl">'+(L==='ru'?'Ждать ещё (лет)':'להמתין עוד (שנים)')+'</span><span class="f-val" id="hiWV" onclick="ed(this,\'hiW\')">'+wait+'</span></div><input type="range" id="hiW" min="6" max="30" step="6" value="'+wait+'" oninput="renderCalc(\'hish\')"><div class="f-note">'+(L==='ru'?'Цикл 6 лет · 0% налог':'מחזור 6 שנים · 0% מס')+'</div></div></div>';
  h+='<div class="res"><div class="res-lbl">'+(L==='ru'?'забрать сейчас':'למשוך עכשיו')+'</div><div class="res-num">'+fm(bal)+' ₪</div><div class="res-line"></div></div>';
  h+='<div class="res" style="background:var(--rd)"><div class="res-lbl" style="color:rgba(255,255,255,.7)">'+(L==='ru'?'оставить ещё '+wait+' лет':'להשאיר עוד '+wait+' שנים')+'</div><div class="res-num">'+fm(fut)+' ₪</div><div class="res-line" style="background:var(--bg)"></div>';
  h+='<div class="res-row"><div class="res-item"><div class="res-item-lbl" style="color:rgba(255,255,255,.5)">'+(L==='ru'?'Заработает рынок':'רווח שוק')+'</div><div class="res-item-val">+'+fm(diff)+' ₪</div></div>';
  h+='<div class="res-item"><div class="res-item-lbl" style="color:rgba(255,255,255,.5)">'+(L==='ru'?'Новые отчисления':'הפקדות חדשות')+'</div><div class="res-item-val">+'+fm(nc)+' ₪</div></div></div></div>';
  return h;
}

/* ── HEALTH ── */
function renderHealthPage(V){
  var inc=V('fhI',15000),house=V('fhH',4500),debt=V('fhD',0),sav=V('fhS',2000);
  if(inc<=0)inc=1;
  var hp=Math.round(house/inc*100),dp=Math.round((house+debt)/inc*100),sp=Math.round(sav/inc*100);
  var free=inc-house-debt-sav;
  function gr(v,g,o){return v<=g?'#4a8c5c':v<=o?'#b8860b':'var(--rd)'}
  var sc=0;if(hp<=30)sc++;if(hp<=25)sc++;if(dp<=40)sc++;if(dp<=30)sc++;if(sp>=20)sc++;if(sp>=30)sc++;
  var verd=sc>=5?(L==='ru'?'Отличное':'מצוין'):sc>=3?(L==='ru'?'Нормальное':'סביר'):(L==='ru'?'Требует внимания':'דורש תשומת לב');
  var h='<div class="ph"><div class="ph-sub">'+(L==='ru'?'Проверка':'בדיקה')+'</div><div class="ph-title">'+t('mHealth')+'</div></div><div class="fields">';
  h+='<div class="f"><div class="f-row"><span class="f-lbl">'+t('incNet')+'</span><span class="f-val" id="fhIV" onclick="ed(this,\'fhI\')">'+fm(inc)+' ₪</span></div><input type="range" id="fhI" min="5000" max="80000" step="500" value="'+inc+'" oninput="renderCalc(\'health\')"></div>';
  h+='<div class="f"><div class="f-row"><span class="f-lbl">'+(L==='ru'?'Жильё':'דיור')+'</span><span class="f-val" id="fhHV" onclick="ed(this,\'fhH\')">'+fm(house)+' ₪</span></div><input type="range" id="fhH" min="0" max="20000" step="100" value="'+house+'" oninput="renderCalc(\'health\')"></div>';
  h+='<div class="f"><div class="f-row"><span class="f-lbl">'+(L==='ru'?'Кредиты и долги':'הלוואות וחובות')+'</span><span class="f-val" id="fhDV" onclick="ed(this,\'fhD\')">'+fm(debt)+' ₪</span></div><input type="range" id="fhD" min="0" max="15000" step="100" value="'+debt+'" oninput="renderCalc(\'health\')"></div>';
  h+='<div class="f"><div class="f-row"><span class="f-lbl">'+(L==='ru'?'Откладываешь':'חוסך')+'</span><span class="f-val" id="fhSV" onclick="ed(this,\'fhS\')">'+fm(sav)+' ₪</span></div><input type="range" id="fhS" min="0" max="30000" step="100" value="'+sav+'" oninput="renderCalc(\'health\')"></div></div>';
  h+='<div class="res"><div class="res-lbl">'+(L==='ru'?'состояние':'מצב')+'</div><div class="res-num" style="font-size:24px">'+verd+'</div><div class="res-line"></div>';
  h+='<div class="res-row"><div class="res-item"><div class="res-item-lbl">'+(L==='ru'?'Свободные':'פנוי')+'</div><div class="res-item-val">'+fm(free)+' ₪</div></div><div class="res-item"></div></div></div>';
  h+='<div style="margin:16px">';
  var bars=[[L==='ru'?'Жильё':'דיור',hp,gr(hp,30,40),'≤30%'],[L==='ru'?'Все долги':'סה"כ חובות',dp,gr(dp,40,50),'≤40%'],[L==='ru'?'Сбережения':'חיסכון',sp,sp>=20?'#4a8c5c':sp>=10?'#b8860b':'var(--rd)','≥20%']];
  bars.forEach(function(b){
    h+='<div style="padding:14px 0;border-bottom:1px solid var(--ln)"><div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--gr)">'+b[0]+'</span><span style="font-size:16px;font-weight:700;color:'+b[2]+'">'+b[1]+'%</span></div>';
    h+='<div style="height:4px;background:var(--ln);margin-top:6px"><div style="height:100%;width:'+Math.min(b[1],100)+'%;background:'+b[2]+'"></div></div>';
    h+='<div style="font-size:11px;color:var(--gr);margin-top:4px">'+(L==='ru'?'Норма':'נורמה')+': '+b[3]+'</div></div>';
  });
  h+='</div>';return h;
}

/* ── CITY ── */
var CITIES=[{n:['Тель-Авив','תל אביב'],r1:4800,r2:6500,r3:8500,arn:350,kid:3200,groc:110},{n:['Иерусалим','ירושלים'],r1:3200,r2:4500,r3:5800,arn:280,kid:2500,groc:100},{n:['Хайфа','חיפה'],r1:2600,r2:3500,r3:4500,arn:220,kid:2200,groc:95},{n:['Беэр-Шева','באר שבע'],r1:2200,r2:3000,r3:3800,arn:180,kid:2000,groc:90},{n:['Нетания','נתניה'],r1:3200,r2:4200,r3:5500,arn:260,kid:2600,groc:100},{n:['Раанана','רעננה'],r1:4200,r2:5800,r3:7500,arn:320,kid:3000,groc:108},{n:['Ришон','ראשון לציון'],r1:3000,r2:4200,r3:5500,arn:250,kid:2600,groc:100},{n:['Петах-Тиква','פתח תקווה'],r1:2800,r2:3800,r3:5000,arn:240,kid:2400,groc:98},{n:['Ашдод','אשדוד'],r1:2500,r2:3400,r3:4200,arn:200,kid:2200,groc:92},{n:['Герцлия','הרצליה'],r1:4500,r2:6200,r3:8000,arn:340,kid:3100,groc:110}];
function renderCityPage(){
  var h='<div class="ph"><div class="ph-sub">'+t('compare')+'</div><div class="ph-title">'+t('mCity')+'</div></div>';
  h+='<div class="tog" id="cityFam"><button '+(cityType===0?'class="on"':'')+' onclick="cityType=0;renderCalc(\'city\')">'+t('single')+'</button><button '+(cityType===1?'class="on"':'')+' onclick="cityType=1;renderCalc(\'city\')">'+t('couple')+'</button><button '+(cityType===2?'class="on"':'')+' onclick="cityType=2;renderCalc(\'city\')">'+t('famKid')+'</button></div>';
  var li=L==='ru'?0:1;
  var sorted=CITIES.map(function(c){var r=cityType===0?c.r1:cityType===1?c.r2:c.r3;var k=cityType===2?c.kid:0;var g=Math.round(c.groc/100*(cityType===0?2500:cityType===1?4000:5000));return{n:c.n[li],rent:r,arn:c.arn,kid:k,groc:g,total:r+c.arn+k+g}}).sort(function(a,b){return a.total-b.total});
  var cheap=sorted[0].total;
  h+='<div class="section-title">'+(L==='ru'?'От дешёвого к дорогому':'מהזול ליקר')+'</div>';
  sorted.forEach(function(c,i){
    var df=c.total-cheap;var pct=Math.round(df/cheap*100);
    h+='<div style="margin:0 16px;padding:14px 0;border-bottom:1px solid var(--ln)"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:600">'+c.n+'</span><span style="font-size:16px;font-weight:700;direction:ltr">'+fm(c.total)+' ₪</span></div>';
    if(i>0)h+='<div style="font-size:11px;color:var(--rd);margin-top:2px">+'+fm(df)+' (+'+pct+'%)</div>';
    else h+='<div style="font-size:11px;color:#4a8c5c;margin-top:2px">'+(L==='ru'?'Самый доступный':'הזול ביותר')+'</div>';
    h+='<div style="display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--gr);flex-wrap:wrap"><span>'+(L==='ru'?'Аренда':'שכ"ד')+': '+fm(c.rent)+'</span><span>'+(L==='ru'?'Арнона':'ארנונה')+': '+fm(c.arn)+'</span>';
    if(cityType===2)h+='<span>'+(L==='ru'?'Садик':'גן')+': '+fm(c.kid)+'</span>';
    h+='</div></div>';
  });
  return h;
}

/* ── STATS ── */
function renderStatsPage(){
  var h='<div class="ph"><div class="ph-sub">'+t('ref')+'</div><div class="ph-title">'+t('mStats')+'</div></div>';
  var rows=L==='ru'?[
    ['Расходы',''],['Один человек','11,000 ₪'],['Семья','16,400 ₪'],['',''],
    ['Зарплаты',''],['Средняя брутто','12,600 ₪'],['Медиана брутто','9,500 ₪'],['',''],
    ['Отчисления',''],['Пенсия (работник+работод.)','18.5%'],['Керен Иштальмут','1,570 ₪/мес'],['Иштальмут: 0% налог','после 6 лет'],['',''],
    ['Правило 4%',''],['Target одиночки','3,300,000 ₪'],['Target семьи','4,920,000 ₪'],['Средняя доходность','7%/год']
  ]:[
    ['הוצאות',''],['יחיד','11,000 ₪'],['משפחה','16,400 ₪'],['',''],
    ['שכר',''],['ממוצע ברוטו','12,600 ₪'],['חציון ברוטו','9,500 ₪'],['',''],
    ['הפרשות',''],['פנסיה (עובד+מעביד)','18.5%'],['קרן השתלמות','1,570 ₪/חודש'],['השתלמות: 0% מס','אחרי 6 שנים'],['',''],
    ['כלל 4%',''],['יעד יחיד','3,300,000 ₪'],['יעד משפחה','4,920,000 ₪'],['תשואה ממוצעת','7%/שנה']
  ];
  rows.forEach(function(r){
    if(!r[0]&&!r[1])return;
    if(!r[1])h+='<div class="section-title">'+r[0]+'</div>';
    else h+='<div class="stat-row"><span class="stat-lbl">'+r[0]+'</span><span class="stat-val">'+r[1]+'</span></div>';
  });
  h+='<div style="padding:16px;font-size:12px;color:var(--gr);line-height:1.5">'+(L==='ru'?'Источники: ЦСБ Израиля (למ"ס), Банк Израиля, S&P 500 / MSCI World.':'מקורות: הלמ"ס, בנק ישראל, S&P 500 / MSCI World.')+'</div>';
  return h;
}

/* ── INIT ── */
renderPage();
</script>
